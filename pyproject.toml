[project]
name = "bo3-mcp"
version = "0.1.0"
description = "MCP server for authoring Black Ops III custom zombie maps"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
]

[project.scripts]
bo3-mcp = "bo3_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bo3_mcp"]
